# Production deploy. It triggers on a pull request being merged into main.
#
# Order matters: migrations run against Neon before either image is deployed,
# so a destructive migration takes effect while the previous revision is still
# serving traffic. Keep migrations additive, or split them over two PRs.
#
# Steps: authenticate to GCP through Workload Identity Federation (no
# long-lived service account key) -> `prisma migrate deploy` against Neon ->
# build and push both images to Artifact Registry -> `gcloud run deploy` each.
#
# Repository secrets it needs:
#   WIF_PROVIDER, WIF_SERVICE_ACCOUNT  GCP authentication
#   PROD_DATABASE_URL                  Neon, for the migration step
#   NEXT_PUBLIC_API                    baked into the frontend image
#   NEXT_PUBLIC_LINE_LIFF_ID           baked into the frontend image
#
# The services' own runtime environment variables are not set here. They live
# on the Cloud Run services in GCP, and `gcloud run deploy --image` leaves them
# untouched, so adding a new one means adding it there by hand as well.

name: Deploy to GCP

on:
  pull_request:
    branches: [main]
    types: [closed]

env:
  PROJECT_ID: no-invite-478215
  REGION: asia-east1
  BACKEND_SERVICE: backend
  FRONTEND_SERVICE: frontend
  AR_REPO: no-invite

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # Gives the runner gcloud plus the docker credential helper
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Lets docker push to Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # buildx, for layer caching and cross-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js (for Prisma migration)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies for Prisma migration
        working-directory: ./backend
        run: npm ci --ignore-scripts

      - name: Run Prisma Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: npx prisma migrate deploy

      # Build & Push Backend
      - name: Build & Push Backend (local buildx)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/backend:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # Build & Push Frontend
      - name: Build & Push Frontend (local buildx)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:latest
          build-args: |
            NEXT_PUBLIC_API=${{ secrets.NEXT_PUBLIC_API }}
            NEXT_PUBLIC_LINE_LIFF_ID=${{ secrets.NEXT_PUBLIC_LINE_LIFF_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/backend:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated

      - name: Show Deployment URLs
        run: |
          echo "Backend URL: $(gcloud run services describe ${{ env.BACKEND_SERVICE }} --region=${{ env.REGION }} --format='value(status.url)')"
          echo "Frontend URL: $(gcloud run services describe ${{ env.FRONTEND_SERVICE }} --region=${{ env.REGION }} --format='value(status.url)')"
