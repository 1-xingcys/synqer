# Checks run on every pull request, as three independent jobs.
#
# ci-contract guards the generated API contract. The backend emits
# backend/openapi/openapi.json from its controllers, the frontend generates
# frontend/generated/openapi.ts from that file, and both are committed. This
# job regenerates them and fails if anything differs, so a backend change that
# alters the API has to be followed locally by:
#     npm --prefix backend run openapi:generate
#     npm --prefix frontend run api:gen
# It also runs a whole-project frontend type check, which the unit tests do not
# substitute for: ts-jest is configured here without type diagnostics, so a
# file containing an outright type error still compiles and its tests still
# pass. `tsc --noEmit` is the only step that catches those.
#
# ci-backend additionally rejects direct process.env access outside the config
# layer, so every variable stays declared in src/config/env.validation.ts and
# is validated at boot instead of read ad hoc.

name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ci-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx --prefix backend prisma generate --schema=backend/prisma/schema.prisma

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Generate backend OpenAPI spec
        run: npm --prefix backend run openapi:generate

      - name: Verify backend OpenAPI is committed
        run: git diff --exit-code -- backend/openapi/openapi.json

      - name: Generate frontend OpenAPI types
        run: npm --prefix frontend run api:gen

      - name: Verify frontend generated types are committed
        run: git diff --exit-code -- frontend/generated/openapi.ts

      - name: Frontend type check
        run: npx --prefix frontend tsc --noEmit --project frontend/tsconfig.json

      - name: Backend build check
        run: npm --prefix backend run build

  ci-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Unit test
        run: npm test

  ci-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint:ci

      - name: Guard against direct process.env access
        run: |
          matches=$(grep -rn "process\.env" src --include="*.ts" \
            | grep -v "\.spec\.ts" \
            | grep -v "src/config/env.validation.ts" || true)
          if [ -n "$matches" ]; then
            echo "Direct process.env access found outside the config layer:"
            echo "$matches"
            echo "Read env via the typed ConfigService instead (see src/config/env.validation.ts)."
            exit 1
          fi

      - name: Unit test
        run: npm test -- --passWithNoTests
