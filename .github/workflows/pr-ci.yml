name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ci-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx --prefix backend prisma generate --schema=backend/prisma/schema.prisma

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Generate backend OpenAPI spec
        run: npm --prefix backend run openapi:generate

      - name: Verify backend OpenAPI is committed
        run: git diff --exit-code -- backend/openapi/openapi.json

      - name: Generate frontend OpenAPI types
        run: npm --prefix frontend run api:gen

      - name: Verify frontend generated types are committed
        run: git diff --exit-code -- frontend/generated/openapi.ts

      - name: Frontend type check
        run: npx --prefix frontend tsc --noEmit --project frontend/tsconfig.json

      - name: Backend build check
        run: npm --prefix backend run build

  ci-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test

  ci-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test -- --passWithNoTests
