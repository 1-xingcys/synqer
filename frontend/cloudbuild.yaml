steps:
  # 构建 Docker 镜像
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_API=${_NEXT_PUBLIC_API}'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_BASE=${_NEXT_PUBLIC_API_BASE}'
      - '--tag'
      - '${_IMAGE_NAME}:${_TAG}'
      - '.'
    id: 'build-image'

  # 推送镜像到 Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_IMAGE_NAME}:${_TAG}'
    id: 'push-image'

# 替换变量（可以在命令行中覆盖）
substitutions:
  _IMAGE_NAME: 'asia-east1-docker.pkg.dev/no-invite-478215/no-invite/frontend'
  _TAG: 'latest'  # 默认使用 latest，可以通过命令行覆盖
  _NEXT_PUBLIC_API: 'https://backend-130274261356.asia-east1.run.app'
  _NEXT_PUBLIC_API_BASE: 'https://backend-130274261356.asia-east1.run.app'

# 镜像输出
images:
  - '${_IMAGE_NAME}:${_TAG}'

options:
  machineType: 'E2_HIGHCPU_8'  # 使用更快的机器类型以加速构建
  logging: CLOUD_LOGGING_ONLY

