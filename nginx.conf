# Local development reverse proxy. Production never uses this file — Cloud Run
# serves the two containers directly (synqer.club and api.synqer.club).
#
# Why this exists: LIFF and the session cookie both require a single HTTPS
# origin, but the app is two dev servers on two ports. Nginx merges them behind
# :8088 so the browser only ever sees one origin.
#
#   LINE / browser
#     -> https://<your-tunnel-subdomain>      (ask the team for the token)
#     -> Cloudflare tunnel
#     -> cloudflared on your machine
#     -> localhost:8088                       (this file)
#          /api/  -> Nest  on :8080           (the /api prefix is stripped)
#          /      -> Next  on :3000
#
# Start it with ./run-nginx.sh, which needs both dev servers already running.

events {}

http {
  # Allow WebSocket upgrades (Next.js HMR, WS, SSE).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream frontend {
    # macOS + Docker: host.docker.internal points to the host network.
    server host.docker.internal:3000;
  }

  upstream backend {
    server host.docker.internal:8080;
  }

  server {
    listen 8088;
    server_name _;

    # === API -> backend ===
    # Frontend should call /api/*, nginx strips /api prefix.
    #
    # The trailing slash on proxy_pass is what strips it: /api/auth/me reaches
    # Nest as /auth/me. This mirrors production, where the frontend is built
    # with NEXT_PUBLIC_API pointing at the api subdomain instead, and no prefix
    # is involved at all. Both routes end up calling the same Nest paths.
    location /api/ {
      proxy_pass http://backend/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Hardcoded https because the tunnel terminates TLS before this hop, so
      # the request arrives here over plain http and would otherwise be
      # reported as such. Together with `trust proxy` in backend/src/main.ts
      # this is what makes Express treat the request as secure. Nothing
      # branches on it today — the session cookie's secure flag follows
      # NODE_ENV, and the OAuth redirect URIs are read verbatim from env — but
      # it keeps the proxied request an honest description of the original.
      proxy_set_header X-Forwarded-Proto https;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
    }

    # === Frontend -> Next.js dev server ===
    # No trailing slash here, so the path is passed through untouched.
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
